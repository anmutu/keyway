name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        run: corepack enable

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          # runner 镜像自带的 azure-cli/microsoft 源偶发 403,先摘掉再 update
          sudo rm -f /etc/apt/sources.list.d/*azure-cli* /etc/apt/sources.list.d/*microsoft*
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Keyway ${{ github.ref_name }}"
          releaseBody: "见 Assets 下载对应平台安装包。macOS 未公证签名,首次打开请右键→打开。"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  sync-tap:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$TAP_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone git@github.com:anmutu/homebrew-tap.git tap

      - name: Update cask to ${{ github.ref_name }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cd tap
          curl -fsSL -o a.dmg "https://github.com/anmutu/keyway/releases/download/${GITHUB_REF_NAME}/Keyway_${VER}_aarch64.dmg"
          curl -fsSL -o x.dmg "https://github.com/anmutu/keyway/releases/download/${GITHUB_REF_NAME}/Keyway_${VER}_x64.dmg"
          ARM=$(sha256sum a.dmg | cut -d" " -f1)
          X64=$(sha256sum x.dmg | cut -d" " -f1)
          python3 - "$VER" "$ARM" "$X64" <<'PY'
          import re, sys
          ver, arm, x64 = sys.argv[1:4]
          p = "Casks/keyway.rb"
          s = open(p).read()
          s = re.sub(r'version "[^"]+"', f'version "{ver}"', s)
          parts = s.split('sha256 "')
          assert len(parts) == 3, "cask 应恰好有两处 sha256"
          head, mid, tail = parts
          mid = mid.split('"', 1)
          tail = tail.split('"', 1)
          s = head + f'sha256 "{arm}"' + mid[1] + f'sha256 "{x64}"' + tail[1]
          open(p, "w").write(s)
          PY
          git config user.name "release-bot"
          git config user.email "noreply@keyway.one"
          git commit -am "cask: keyway ${VER}"
          git push
