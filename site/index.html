    <style>
      /* ============ Apple.cn 风格:极简、留白、超大标题、亮色 ============ */
      :root {

      /* 截图窗口栏(macOS 信号灯) */
      .win-bar { position: relative; display: flex; align-items: center; gap: 8px; padding: 11px 14px;

      th { font-size: 12px; color: var(--fg-3); font-weight: 500; text-transform: none; }
      td:first-child { font-weight: 600; }
      td.yes { color: var(--fg); } td.no { color: var(--fg-3); }
      td.yes::before { content: "✓ "; color: #30a74a; font-weight: 600; }

      /* FAQ */
      .faq { max-width: 720px; margin: 48px auto 0; text-align: left; }
      .faq details { border-bottom: 1px solid var(--hair); padding: 22px 6px; }
      .faq details summary {
        font-size: 17px; font-weight: 600; cursor: pointer; list-style: none;
        display: flex; justify-content: space-between; align-items: center; gap: 18px;
        transition: color .15s;
      }
      .faq details summary:hover { color: var(--blue); }
      .faq details summary::-webkit-details-marker { display: none; }
      .faq details summary::after {
        content: "+"; color: var(--fg-3); font-size: 24px; font-weight: 300; line-height: 1;
        flex: none; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
        transition: transform .25s ease, color .15s;
      }
      .faq details summary:hover::after { color: var(--blue); }
      .faq details[open] summary::after { transform: rotate(45deg); }
      .faq details p { font-size: 15px; color: var(--fg-2); margin-top: 10px; line-height: 1.65; }
      .faq details p code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; background: var(--bg-alt); border-radius: 5px; padding: 1px 5px; }

      /* footnote + footer(Apple 风格) */
      .footnotes { background: var(--bg-alt); padding: 34px 0 30px; }
      .footnotes .container { text-align: left; }
      .footnotes p { font-size: 12px; color: var(--fg-3); line-height: 1.6; margin-bottom: 8px; }
      .footnotes .divider { height: 1px; background: var(--hair); margin: 18px 0; }
      footer { background: var(--bg-alt); padding: 0 0 34px; }
      footer .container { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--fg-3); }
      footer a { color: #424245; text-decoration: none; }
      footer a:hover { color: var(--blue); text-decoration: underline; }
  
      /* 站点页脚(全站统一) */
      .site-footer { background: var(--bg-alt); border-top: 1px solid var(--hair); padding: 56px 22px 28px; }
      .footer-grid { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 36px; text-align: left; }
      .footer-brand .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; font-family: "Iowan Old Style", "Palatino Linotype", ui-serif, Georgia, "Songti SC", "Noto Serif SC", serif; }
      .footer-brand p { color: var(--fg-2); font-size: 13.5px; line-height: 1.7; margin: 12px 0 0; }
      .footer-brand .mono, .footer-bar .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; color: var(--fg-3); letter-spacing: .06em; }
      .footer-col { display: flex; flex-direction: column; gap: 10px; }
      .footer-col b { font-size: 12px; color: var(--fg-3); letter-spacing: .1em; text-transform: uppercase; font-weight: 600; margin-bottom: 2px; }
      .footer-col a { color: var(--fg-2); text-decoration: none; font-size: 14px; }
      .footer-col a:hover { color: var(--blue); }
      .footer-bar { max-width: 980px; margin: 36px auto 0; padding-top: 18px; border-top: 1px solid var(--hair); display: flex; justify-content: space-between; font-size: 12.5px; color: var(--fg-3); }
      @media (max-width: 760px) { .footer-grid { grid-template-columns: 1fr 1fr; } }

      );
        if (!("IntersectionObserver" in window)) {
          els.forEach(function (el) { el.classList.add("in"); });
          return;
        }
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
          });
        }, { rootMargin: "0px 0px -12% 0px", threshold: 0.05 });
        els.forEach(function (el) { io.observe(el); });
        window.setTimeout(function () {
          els.forEach(function (el) {
            if (el.getBoundingClientRect().top < window.innerHeight * 1.25) el.classList.add("in");
          });
        }, 1400);
      })();

    <script src="./release-sync.js"></script>
    <script>
      // 开场:One key · one way → keyway.one —— motto 折叠成域名。
      // one₁(替身)螺旋化作小数点;one₂ 落位染蓝;key 与 way 对撞合体。
      // 无 JS / 减少动态时直接呈现终态;点击标题可重播。
      (function () {
        var h1 = document.getElementById("brandHero");
        if (!h1) return;
        var seq = h1.querySelector(".kw-seq");
        var K = seq.querySelector('[data-kw="key"]');
        var W = seq.querySelector('[data-kw="way"]');
        var D = seq.querySelector('[data-kw="dot"]');
        var O = seq.querySelector('[data-kw="one"]');
        if (!K || !W || !D || !O || !O.animate) return;
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

        var hero = h1.closest(".hero");
        var playing = false;

        function play(holdSiblings) {
          if (playing) return;
          playing = true;
          var anims = [];
          [K, W, D, O].forEach(function (el) {
            el.getAnimations().forEach(function (a) { a.cancel(); });
            el.style.opacity = ""; el.style.transform = ""; el.style.filter = "";
          });
          O.style.color = "";
          seq.querySelectorAll(".kw-sep, .kw-one1, .kw-ring, .kw-spark, .kw-dust, .kw-trail, .kw-underline").forEach(function (el) { el.remove(); });
          var oldGlow = h1.querySelector(".kw-glow");
          if (oldGlow) oldGlow.remove();

          var em = parseFloat(getComputedStyle(h1).fontSize);
          var c = seq.getBoundingClientRect();
          function x(el) { return el.getBoundingClientRect().left - c.left; }
          function w(el) { return el.getBoundingClientRect().width; }
          var topY = K.getBoundingClientRect().top - c.top;
          var lineCy = topY + K.getBoundingClientRect().height / 2;

          // 终位(D 恒为 ".",零回流)
          var fK = x(K), fW = x(W), fD = x(D), fO = x(O);
          var endRight = fO + w(O);
          var wK = w(K), wW = w(W), wD = w(D);

          // one₁ 替身:绝对定位,不影响博客流
          var one1 = document.createElement("span");
          one1.className = "kw kw-one1";
          one1.textContent = "one";
          one1.style.cssText = "position:absolute;opacity:0;color:var(--fg);";
          seq.appendChild(one1);
          var wOne = w(one1);

          // 起始排布:one₁ key · one₂ way(motto 阶段全部同色)
          var g = wK * 0.3;
          var sepW = em * 0.32;
          var startW = wOne + g + wK + g * 0.6 + sepW + g * 0.6 + wOne + g + wW;
          var center = (fK + endRight) / 2;
          var sx1 = center - startW / 2;
          var sxK = sx1 + wOne + g;
          var sxSep = sxK + wK + g * 0.6;
          var sx2 = sxSep + sepW + g * 0.6;
          var sxW = sx2 + wOne + g;
          var dK = sxK - fK, dW = sxW - fW, dO = sx2 - fO;
          one1.style.left = sx1 + "px";
          one1.style.top = topY + "px";
          D.style.opacity = "0";
          O.style.color = "var(--fg)";   // motto 阶段统一深色

          if (holdSiblings && hero) hero.classList.add("intro-hold");

          // 分隔符 ·
          var sep = document.createElement("span");
          sep.className = "kw-sep";
          sep.textContent = "·";
          sep.style.cssText = "position:absolute;opacity:0;";
          seq.appendChild(sep);
          sep.style.left = sxSep + "px";
          sep.style.top = (lineCy - em * 0.55) + "px";

          // ===== 第一幕:从景深中翻飞入场,拼出 one key · one way =====
          var order = [[one1, null, 0], [K, dK, 1], [sep, null, 2], [O, dO, 3], [W, dW, 4]];
          order.forEach(function (cfg) {
            var el = cfg[0], d = cfg[1], i = cfg[2];
            var fromY = (i % 2 ? -1 : 1) * em * (0.85 + i * 0.12);
            var fromRot = (i % 2 ? 1 : -1) * 16;
            var rest = d === null ? "translate(0," + fromY + "px)" : "translate(" + d + "px," + fromY + "px)";
            anims.push(el.animate(
              [
                { opacity: 0, transform: rest + " rotate(" + fromRot + "deg)", filter: "blur(9px)" },
                { opacity: 1, transform: (d === null ? "translate(0,0)" : "translate(" + d + "px,0)") + " rotate(0deg)", filter: "blur(0px)" }
              ],
              { duration: 480, delay: 90 + i * 105, easing: "cubic-bezier(.22,.9,.32,1.18)", fill: "both" }
            ));
            el.style.opacity = "0";
          });

          // ===== 第二幕:变形 =====
          function ring(cx, cy, scaleTo, delay) {
            setTimeout(function () {
              var r = document.createElement("span");
              r.className = "kw-ring";
              seq.appendChild(r);
              var size = em * 0.7;
              r.style.width = r.style.height = size + "px";
              r.style.left = (cx - size / 2) + "px";
              r.style.top = (cy - size / 2) + "px";
              r.animate([{ opacity: .85, transform: "scale(.15)" }, { opacity: 0, transform: "scale(" + scaleTo + ")" }],
                { duration: 460, easing: "cubic-bezier(.2,.7,.35,1)" }).onfinish = function () { r.remove(); };
            }, delay);
          }
          function sparks(cx, cy, n, delay) {
            setTimeout(function () {
              for (var i = 0; i < n; i++) {
                (function (i) {
                  var sp = document.createElement("span");
                  sp.className = "kw-spark";
                  sp.textContent = "✦";
                  seq.appendChild(sp);
                  sp.style.left = cx + "px"; sp.style.top = (cy - em * 0.3) + "px";
                  var a = (Math.PI * 2 * i) / n + 0.5;
                  sp.animate([{ opacity: 1, transform: "translate(0,0) scale(.4)" },
                    { opacity: 0, transform: "translate(" + Math.cos(a) * em * 1.1 + "px," + (Math.sin(a) * em * 1.1 - em * .2) + "px) scale(1.15)" }],
                    { duration: 360 + i * 40, easing: "cubic-bezier(.2,.7,.4,1)" }).onfinish = function () { sp.remove(); };
                })(i);
              }
            }, delay);
          }
          function dust(cx, cy) {
            [-1, 1].forEach(function (sd, i) {
              var d = document.createElement("span");
              d.className = "kw-dust";
              seq.appendChild(d);
              d.style.left = (cx + sd * em * 0.42) + "px";
              d.style.top = (cy + em * 0.32) + "px";
              d.animate([{ opacity: .55, transform: "translate(0,0) scale(.4)" },
                { opacity: 0, transform: "translate(" + sd * em * 0.5 + "px," + -em * 0.12 + "px) scale(1.5)" }],
                { duration: 380, delay: i * 60, easing: "ease-out" }).onfinish = function () { d.remove(); };
            });
          }

          setTimeout(function () {
            if (holdSiblings && hero) hero.classList.remove("intro-hold");
            // 分隔符消散
            anims.push(sep.animate([{ opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", transform: "translate(0,-" + em * 0.3 + "px) scale(.4)" }], { duration: 200, fill: "forwards" }));

            // key 与 way:后撤蓄力 → 对撞合体(爆闪)
            [[K, dK, -1], [W, dW, 1]].forEach(function (cfg) {
              var el = cfg[0], d = cfg[1], dir = cfg[2];
              anims.push(el.animate(
                [
                  { transform: "translate(" + d + "px,0)" },
                  { transform: "translate(" + (d + dir * em * 0.32) + "px," + -em * 0.04 + "px)", offset: .34, easing: "cubic-bezier(.5,0,.8,.5)" },
                  { transform: "translate(" + dir * em * 0.06 + "px,0) scaleX(1.14)", offset: .62, easing: "cubic-bezier(.2,.9,.3,1)" },
                  { transform: "translate(0,0) scaleX(1)" }
                ],
                { duration: 560, fill: "both" }
              ));
            });
            ring(fW, lineCy, 2.6, 320);
            sparks(fW, lineCy, 6, 330);

            // one₁:螺旋升空 → 收束坠入句点(拖光尾);真实句点在收束处亮起
            for (var ti = 0; ti < 5; ti++) {
              (function (ti) {
                setTimeout(function () {
                  var tr = document.createElement("span");
                  tr.className = "kw-trail";
                  seq.appendChild(tr);
                  var p = ti / 5;
                  var tx = (fD + wD / 2 - wOne / 2 - sx1) * p;
                  var ty = -em * 1.05 * Math.sin(Math.PI * p);
                  tr.style.left = (sx1 + tx) + "px";
                  tr.style.top = (lineCy + ty) + "px";
                  tr.animate([{ opacity: .8, transform: "scale(1.3)" }, { opacity: 0, transform: "scale(.2)" }], { duration: 420, easing: "ease-out" }).onfinish = function () { tr.remove(); };
                }, 260 + ti * 90);
              })(ti);
            }
            var d1x = (fD + wD / 2 - wOne / 2) - sx1;
            anims.push(one1.animate(
              [
                { transform: "translate(0,0) rotate(0deg) scale(1)", opacity: 1, filter: "blur(0px)", easing: "cubic-bezier(.4,.3,.6,.7)" },
                { transform: "translate(" + d1x * 0.45 + "px," + -em * 1.05 + "px) rotate(380deg) scale(.62)", opacity: 1, filter: "blur(2px)", easing: "cubic-bezier(.5,0,.7,.4)" },
                { transform: "translate(" + d1x + "px," + -em * 0.02 + "px) rotate(700deg) scale(.3)", opacity: 1, offset: .82 },
                { transform: "translate(" + d1x + "px," + 0 + "px) rotate(720deg) scale(.22)", opacity: 0, filter: "blur(3px)" }
              ],
              { duration: 720, delay: 230, fill: "both" }
            ));
            setTimeout(function () {
              anims.push(D.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 90, fill: "both" }));
              anims.push(D.animate(
                [{ transform: "scale(.4)" }, { transform: "scale(1.6)", offset: .5, easing: "cubic-bezier(.3,.8,.5,1.3)" }, { transform: "scale(1)" }],
                { duration: 260 }
              ));
              ring(fD + wD / 2, lineCy, 1.6, 0);
            }, 900);

            // one₂:跃过 way,空翻落位 → 染蓝(尘土+冲击环)
            anims.push(O.animate(
              [
                { transform: "translate(" + dO + "px,0) rotate(0deg)", easing: "cubic-bezier(.35,.5,.55,1)" },
                { transform: "translate(" + dO * 0.4 + "px," + -em * 1.25 + "px) rotate(-190deg)", easing: "cubic-bezier(.5,0,.7,.5)" },
                { transform: "translate(0,0) rotate(-360deg)" }
              ],
              { duration: 690, delay: 330, fill: "both" }
            ));
            anims.push(O.animate(
              [{ transform: "translateY(0) scale(1,1)" },
               { transform: "translateY(3px) scale(1.16,.78)", offset: .5, easing: "cubic-bezier(.3,.7,.4,1.4)" },
               { transform: "translateY(0) scale(1)" }],
              { duration: 320, delay: 1040 }
            ));
            setTimeout(function () { O.style.color = ""; }, 1080);   // 过渡回品牌蓝
            ring(fO + wOne / 2, lineCy, 2.2, 1050);
            dust(fO + wOne / 2, lineCy + em * 0.1);
            sparks(fO + wOne / 2, lineCy, 3, 1060);
          }, 1480);

          // ===== 第三幕:绽放收束 =====
          setTimeout(function () {
            var u = document.createElement("span");
            u.className = "kw-underline";
            seq.appendChild(u);
            u.style.left = fK + "px";
            u.style.width = (endRight - fK) + "px";
            u.animate([{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { duration: 420, easing: "cubic-bezier(.2,.7,.3,1)", fill: "forwards" });
            u.animate([{ backgroundPosition: "130% 0" }, { backgroundPosition: "-30% 0" }], { duration: 720, delay: 380, easing: "ease-out" });
            var gEl = document.createElement("span");
            gEl.className = "kw-glow";
            h1.appendChild(gEl);
            gEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 520, fill: "forwards" });
            anims.push(seq.animate([{ transform: "scale(1.045)" }, { transform: "scale(1)" }], { duration: 400, easing: "cubic-bezier(.25,.9,.3,1.3)" }));
          }, 2620);

          // ===== 收尾:回到自然终态 =====
          setTimeout(function () {
            anims.forEach(function (a) { a.cancel(); });
            [K, W, D, O].forEach(function (el) { el.style.opacity = ""; el.style.transform = ""; el.style.filter = ""; });
            O.style.color = "";
            if (one1.parentNode) one1.remove();
            if (sep.parentNode) sep.remove();
            playing = false;
          }, 3200);
        }

        h1.addEventListener("click", function () { play(false); });
        play(true);
      })();
    </script>
