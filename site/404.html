<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — 页面不在这里 · Keyway</title>
  <meta name="robots" content="noindex" />
  <style>
    :root { --fg:#1d1d1f; --fg-2:#62626d; --blue:#0066cc; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; color:var(--fg); background:#fff; text-align:center; padding:24px; }
    .code { font-size:96px; font-weight:700; letter-spacing:-.03em; color:var(--blue); line-height:1; }
    .msg { margin-top:14px; font-size:19px; color:var(--fg-2); }
    .msg code { background:#f5f5f7; padding:2px 8px; border-radius:6px; font-size:16px; }
    a.btn { display:inline-block; margin-top:26px; background:var(--blue); color:#fff; text-decoration:none; padding:11px 28px; border-radius:980px; font-size:16px; font-weight:500; }
    a.btn:hover { background:#c25f3f; }
    .sub { margin-top:16px; font-size:14px; color:var(--fg-2); }
    .sub a { color:var(--blue); }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <p class="msg">这一页 <code>key</code> 没找到通往这儿的 <code>way</code>。</p>
    <a class="btn" href="/">返回 keyway.one</a>
    <p class="sub"><a href="/guide.html">使用指南</a> · <a href="/en/">English site</a> · <a href="https://github.com/anmutu/keyway">GitHub</a></p>
  </main>
<script src="/shared-header.js?v=6"></script>
</body>
</html>
